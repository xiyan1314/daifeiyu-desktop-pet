# 大肥鱼桌宠 CI（P0-3）：
# push / PR 时跑 pytest 回归 + 无头冒烟验证（offscreen 平台，无需显示器）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # v2.3.1：requests/psutil 固定到 requirements-lock.txt 的实测版本（此前不锁，复现性风险）
          # v2.4（M1）：补 Pillow==12.1.1——tests/test_full_form_frames_v24.py 在模块级
          # `from PIL import Image, ImageChops, ImageStat`（素材质量门），CI 不装 Pillow 时
          # 会在 collection 阶段直接 ImportError，整条流水线红。版本与 requirements-lock.txt 对齐。
          # 不用 importorskip 兜底：这是素材质量门，跳过等于把门丢掉。
          # v2.4.3（第三轮找茬 P3-2）：pytest 也锁精确版本——其余依赖早就锁死了，唯独
          # 它没锁；pytest 9.x → 10.x 若改收集/断言行为，CI 会毫无预兆地变红。
          # 版本与 requirements-lock.txt 一致。
          pip install PySide6==6.11.2 requests==2.34.2 psutil==7.2.2 Pillow==12.1.1 pytest==9.1.1

      - name: Pytest
        run: pytest

      - name: Offscreen smoke
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python _verify_v13.py
