# 大肥鱼桌宠 CI（P0-3）：
# push / PR 时跑 pytest 回归 + 无头冒烟验证（offscreen 平台，无需显示器）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # v2.3.1：requests/psutil 固定到 requirements-lock.txt 的实测版本（此前不锁，复现性风险）
          pip install PySide6==6.11.2 requests==2.34.2 psutil==7.2.2 pytest

      - name: Pytest
        run: pytest

      - name: Offscreen smoke
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python _verify_v13.py
